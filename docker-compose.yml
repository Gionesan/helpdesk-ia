services:
  mysql:
    image: mysql:8.0
    container_name: helpdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: helpdesk_db
    ports:
      - "3306:3306"
    volumes:
      - helpdesk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  helpdesk_mysql_data:
